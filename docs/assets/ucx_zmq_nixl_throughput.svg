  <g class="axis" text-anchor="middle">
    <text x="100" y="412">128K</text><text x="180" y="412">256K</text><text x="260" y="412">512K</text><text x="340" y="412">1M</text><text x="420" y="412">4M</text><text x="500" y="412">16M</text><text x="580" y="412">64M</text><text x="660" y="412">128M</text><text x="740" y="412">256M</text><text x="820" y="412">512M</text><text x="900" y="412">1G</text>
    <text x="100" y="842">128K</text><text x="180" y="842">256K</text><text x="260" y="842">512K</text><text x="340" y="842">1M</text><text x="420" y="842">4M</text><text x="500" y="842">16M</text><text x="580" y="842">64M</text><text x="660" y="842">128M</text><text x="740" y="842">256M</text><text x="820" y="842">512M</text><text x="900" y="842">1G</text>
