<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="940" viewBox="0 0 1100 940">
  <style>
    .title { font: 700 20px sans-serif; fill: #222; }
    .axis { font: 12px sans-serif; fill: #555; }
    .label { font: 700 13px sans-serif; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis-line { stroke: #6b7280; stroke-width: 1.2; }
    .zmq { stroke: #2563eb; fill: #2563eb; }
    .ucx { stroke: #ea580c; fill: #ea580c; }
    .nixl { stroke: #16a34a; fill: #16a34a; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="1100" height="940" fill="white"/>

  <!-- PUT -->
  <text x="500" y="30" text-anchor="middle" class="title">SimpleStorage PUT median throughput</text>
  <text x="45" y="245" text-anchor="middle" class="axis" transform="rotate(-90 45 245)">MiB/s</text>
  <line x1="80" y1="90" x2="900" y2="90" class="grid"/>
  <line x1="80" y1="165" x2="900" y2="165" class="grid"/>
  <line x1="80" y1="240" x2="900" y2="240" class="grid"/>
